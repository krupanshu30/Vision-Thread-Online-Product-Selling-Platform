<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://www.google.com">
  <title>Opening Google...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #fdf2f8;
      color: #333;
    }
    .box {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(236,72,153,0.15);
      border: 1px solid #fbcfe8;
    }
    a.btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #ec4899;
      color: white;
      text-decoration: none;
      border-radius: 99px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(236,72,153,0.3);
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Redirecting to Google...</h2>
    <p>If you are not redirected automatically, click the button below:</p>
    <a href="https://www.google.com" class="btn" target="_blank" rel="noopener noreferrer">👉 Click Here to Open Google</a>
  </div>
  <script>
    window.location.href = "https://www.google.com";
  </script>
</body>
</html>
